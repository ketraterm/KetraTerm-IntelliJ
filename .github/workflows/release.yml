name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RELEASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release automation
        run: node --test .github/scripts/*.test.mjs
      - name: Validate release version and notes
        run: node .github/scripts/release-notes.mjs
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-dejavu-core
      - name: Verify and package
        run: xvfb-run -a ./gradlew spotlessCheck check verifyPlugin "-Djava.awt.headless=true" --continue
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releaseFlags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then releaseFlags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --verify-tag --title "$GITHUB_REF_NAME" --notes-file build/release-notes.md "${releaseFlags[@]}"
      - name: Publish to Marketplace
        if: vars.PUBLISH_TO_MARKETPLACE == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-reports
          path: |
            build/reports/
            build/test-results/
