name: Test Suite
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jvm
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release automation
        run: node --test .github/scripts/*.test.mjs
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-dejavu-core
      - name: Verify plugin
        run: xvfb-run -a ./gradlew spotlessCheck check "-Djava.awt.headless=true" --continue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-reports
          path: |
            build/reports/
            build/test-results/
